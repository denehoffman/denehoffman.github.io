name: Pull request preview

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  preview:
    name: Build review artifact
    runs-on: ubuntu-latest
    steps:
      - name: Checkout pull request
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install Zola and just
        uses: taiki-e/install-action@v2
        with:
          tool: zola@0.22.1,just
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install test dependencies
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Check site
        run: just check
      - name: Compare visual baselines
        run: just test-visual
      - name: Build downloadable preview
        run: zola build --base-url http://127.0.0.1:8000
      - name: Upload site preview
        uses: actions/upload-artifact@v4
        with:
          name: site-preview-${{ github.event.pull_request.number }}
          path: public
          if-no-files-found: error
          retention-days: 14
      - name: Upload browser report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-report-${{ github.event.pull_request.number }}
          path: playwright-report
          if-no-files-found: ignore
          retention-days: 14
      - name: Add preview instructions
        run: |
          echo '### Site preview' >> "$GITHUB_STEP_SUMMARY"
          echo 'Download and unzip the `site-preview-${{ github.event.pull_request.number }}` artifact, then serve that directory with `python3 -m http.server 8000 --bind 127.0.0.1`.' >> "$GITHUB_STEP_SUMMARY"
