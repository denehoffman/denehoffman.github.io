theme = "duckquill"

# Keep the unfinished post out of builds without editing its files.
ignored_content = ["**/2026-06-08-amplitude-analysis-part-1/**", "**/2026-06-08-amplitude-analysis-part-1"]

title = "Dene Hoffman"
base_url = "https://denehoffman.com"
description = "My personal website and blog"

compile_sass = true
minify_html = true
generate_feeds = true
feed_filenames = ["rss.xml", "atom.xml"]
build_search_index = true
author = "Dene Hoffman"

default_language = "en"
taxonomies = [{ name = "tags", feed = true }]

[markdown]
smart_punctuation = true
bottom_footnotes = true
github_alerts = true

[markdown.highlighting]
style = "class"
light_theme = "solarized-light"
dark_theme = "solarized-dark"
extra_grammars = ["syntaxes/math.json"]

[search]
index_format = "fuse_json"

[link_checker]
# These endpoints reject automated HEAD requests even though they work in a browser.
skip_prefixes = [
  "https://math.stackexchange.com/a/2785578/127253",
  "https://doi.org/10.1137/0916069",
  "https://doi.org/10.1002/adom.201700617",
]

[extra]
accent_color = "#a04b24"
accent_color_dark = "#e59668"
issues_url = "https://github.com/denehoffman/denehoffman.github.io/issues"
source_url = "https://github.com/denehoffman/denehoffman.github.io"
show_copy_button = true
show_reading_time = true
show_share_button = true
show_backlinks = true
katex = true
card = true
styles = ["overrides.css"]
scripts = ["mobile-nav.js", "bubble-physics.js", "bubble-interactions.js", "bubble-renderer.js", "bubble-chamber.js"]


csp = [
  { directive = "font-src", domains = [
    "'self'",
  ] },
  { directive = "img-src", domains = [
    "'self'",
    "https:",
    "data:",
  ] },
  { directive = "media-src", domains = [
    "'self'",
    "https:",
  ] },
  { directive = "script-src", domains = [
    "'self'",
  ] },
  { directive = "style-src", domains = [
    "'self'",
    "'unsafe-inline'",
  ] },
  { directive = "frame-src", domains = [
    "https://player.vimeo.com",
    "https://www.youtube-nocookie.com",
    "https://toot.community",
  ] },
  { directive = "connect-src", domains = [
    "'self'",
    "https://toot.community",
  ] },
  { directive = "base-uri", domains = [
    "'none'",
  ] },
  { directive = "form-action", domains = [
    "'none'",
  ] },
]

[extra.nav]
show_feed = true
show_theme_switcher = true
show_repo = true
links = [
  { url = "@/blog/_index.md", name = "Blog" },
  { url = "@/publications/index.md", name = "Publications" },
  { url = "https://github.com/denehoffman/CV/blob/main/cv.pdf", name = "CV" },
  { url = "@/projects/_index.md", name = "Projects" },
]

[extra.footer]
show_copyright = true
